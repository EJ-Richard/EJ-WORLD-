<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>波克萌樂園</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236ee7a8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1a14;--panel:#1a2e24;--panel2:#243d30;--accent:#6ee7a8;--accent2:#fbbf24;--danger:#f87171;--text:#e8f5ee;--muted:#8fb89a;--border:#3d6b52;
--cream:#fffaf0;--cream2:#fff8e6;--ink:#1f2a44;--inkm:#55627d;--cline:#dbe3f0;
--s0:#166534;--s0s:#e4f8ec;--s1:#1d4ed8;--s1s:#e6efff;--s2:#7e22ce;--s2s:#f4ebff}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;overflow:hidden}
#app.battle-mode{max-width:920px}
#app.dex-mode{max-width:560px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}
button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
#title{align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1e3d2a 0%,#0f1a14 70%);padding:24px;text-align:center}
.title-art{width:120px;height:120px;margin-bottom:12px}
.logo{font-size:2.4rem;font-weight:700;letter-spacing:.12em;color:var(--accent);text-shadow:0 0 24px rgba(110,231,168,.4)}
.subtitle{color:var(--muted);margin:6px 0 16px;font-size:.95rem}
.disclaimer{font-size:.7rem;color:#6a8f76;max-width:300px;line-height:1.45;margin-bottom:20px}
.btn{background:linear-gradient(180deg,#4ade80,#22c55e);color:#052e16;font-weight:700;font-size:1.1rem;padding:14px 36px;border-radius:999px;box-shadow:0 4px 0 #15803d,0 8px 20px rgba(34,197,94,.3)}
.btn:active{box-shadow:0 1px 0 #15803d;transform:translateY(3px)}
.btn:disabled{opacity:.45;filter:grayscale(.4);pointer-events:none}
.btn-sec{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #1a2e24;border:1px solid var(--border)}
.btn-sm{font-size:.9rem;padding:10px 20px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
#pick{padding:16px 12px 100px;overflow-y:auto;touch-action:pan-y}
.pick-head{text-align:center;margin-bottom:12px;position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 0}
.pick-head h2{color:var(--accent);font-size:1.35rem}
.pick-head p{color:var(--muted);font-size:.85rem;margin-top:4px}
.party-slots{display:flex;gap:8px;justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.party-slot{width:64px;height:72px;border:2px dashed var(--border);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.65rem;color:var(--muted)}
.party-slot.filled{border-style:solid;border-color:var(--accent);color:var(--text)}
.party-slot canvas{width:40px;height:40px}
.party-slot .ord{font-weight:700;color:var(--accent2);font-size:.7rem}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:2px solid var(--border);border-radius:14px;padding:12px;text-align:center;cursor:pointer;position:relative}
.card:hover,.card.sel{border-color:var(--accent);box-shadow:0 4px 16px rgba(110,231,168,.2)}
.card.sel::after{content:attr(data-ord);position:absolute;top:6px;right:8px;background:var(--accent);color:#052e16;font-weight:700;font-size:.75rem;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.card canvas{display:block;margin:0 auto 6px}
.card .name{font-weight:700;font-size:1rem}
.card .type{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:999px;margin:4px 0;font-weight:600}
.card .stage{display:inline-block;font-size:.65rem;padding:1px 6px;border-radius:6px;margin-left:4px;background:rgba(110,231,168,.15);color:var(--accent)}
.card .flavor{font-size:.72rem;color:var(--muted);line-height:1.35;min-height:2.7em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:.68rem;color:var(--muted);margin-top:6px;text-align:left}
.stats b{color:var(--text)}
.moves-mini{font-size:.65rem;color:var(--accent2);margin-top:4px}
.pick-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:linear-gradient(transparent,var(--bg) 30%);padding:16px;display:flex;justify-content:center;gap:8px;z-index:3;pointer-events:none}
.pick-bar button{pointer-events:auto}
#map{background:#1a3a28}
#mapCanvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.hud-chip{background:rgba(15,26,20,.85);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:.75rem;pointer-events:auto}
.hud-party{display:flex;gap:4px;flex-wrap:wrap;max-width:220px}
.hud-pet{display:inline-flex;align-items:center;gap:3px;background:rgba(110,231,168,.12);border:1px solid var(--border);border-radius:8px;padding:2px 6px;font-size:.68rem}
.hud-pet .pn{font-weight:700;color:var(--accent)}
.hud-pet .php{color:var(--muted)}
.buff{background:rgba(251,191,36,.2);border-color:var(--accent2);color:var(--accent2);margin-top:4px}
.zone-tag{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:rgba(15,26,20,.8);padding:4px 14px;border-radius:999px;font-size:.8rem;border:1px solid var(--border);z-index:5;pointer-events:none}
.stick-wrap{position:absolute;bottom:24px;left:16px;width:110px;height:110px;z-index:6;touch-action:none}
.stick-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);position:relative}
.stick-knob{width:44px;height:44px;border-radius:50%;background:rgba(110,231,168,.7);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.map-btns{position:absolute;bottom:28px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:6}
.map-btns button{background:rgba(26,46,36,.9);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:.8rem;font-weight:600}
.dialog{position:absolute;bottom:140px;left:12px;right:12px;background:rgba(15,26,20,.95);border:2px solid var(--accent);border-radius:14px;padding:14px 16px;z-index:8;display:none}
.dialog h3{color:var(--accent);font-size:.95rem;margin-bottom:6px}
.dialog p{font-size:.85rem;line-height:1.45}
.dialog .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dialog .acts button{flex:1;min-width:80px}
/* Deploy panel */
.deploy{position:absolute;inset:0;background:rgba(0,0,0,.82);z-index:12;display:none;flex-direction:column;padding:16px 12px;overflow-y:auto;touch-action:pan-y}
.deploy.show{display:flex}
.deploy h2{color:var(--accent);text-align:center;margin-bottom:4px}
.deploy .sub{color:var(--muted);text-align:center;font-size:.8rem;margin-bottom:12px}
.deploy-list{display:flex;flex-direction:column;gap:8px;max-width:400px;margin:0 auto;width:100%}
.deploy-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:8px 10px;cursor:pointer}
.deploy-row.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.deploy-row.faint{opacity:.45}
.deploy-row canvas{flex-shrink:0}
.deploy-row .info{flex:1;min-width:0}
.deploy-row .dn{font-weight:700}
.deploy-row .dmeta{font-size:.72rem;color:var(--muted)}
.deploy-row .ord-badge{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.deploy-row.on .ord-badge{background:var(--accent);color:#052e16;border-color:var(--accent)}
.deploy-acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
/* DEX cream panel */
#dex{background:var(--cream);color:var(--ink);touch-action:pan-y;overflow-y:auto}
.dex-top{position:sticky;top:0;z-index:5;background:rgba(255,250,240,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--cline);padding:10px 12px}
.dex-top h2{font-size:1.2rem;font-weight:800}
.dex-top .hint{font-size:.75rem;color:var(--inkm);margin-top:2px}
.dex-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.dex-chips .lab{font-size:.7rem;color:var(--inkm);font-weight:700;margin-right:2px}
.dchip{border:1.5px solid var(--cline);background:#fff;color:var(--ink);padding:4px 10px;border-radius:999px;font-size:.72rem;cursor:pointer;user-select:none}
.dchip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.dex-tabs{display:flex;gap:4px;margin-top:8px}
.dtab{background:none;border:0;color:var(--inkm);padding:6px 12px;font-size:.85rem;font-weight:800;cursor:pointer;border-bottom:3px solid transparent;border-radius:8px 8px 0 0}
.dtab.on{color:var(--ink);border-color:#ffd23f;background:#fff}
.dex-body{padding:12px;padding-bottom:80px}
.dex-info{font-size:.75rem;color:var(--inkm);margin-bottom:10px}
.dex-group{margin-bottom:18px}
.dex-group h3{font-size:.95rem;background:var(--cream2);border:1px solid #f3e0a8;border-left:6px solid #ffd23f;border-radius:10px;padding:6px 10px;margin-bottom:8px;color:var(--ink)}
.dex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcard{background:#fff;border:1px solid var(--cline);border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(31,42,68,.06)}
.dcard canvas{display:block;margin:0 auto 4px}
.dcard .nm{font-weight:800;font-size:.9rem;color:var(--ink)}
.dcard .meta{font-size:.68rem;color:var(--inkm);margin:2px 0}
.dcard .lin{font-size:.65rem;background:var(--cream2);border:1px solid #f3e0a8;border-radius:8px;padding:3px 6px;margin-top:4px;color:#3f4a63;line-height:1.3}
.dcard .stg{font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:4px}
.stg0{background:var(--s0s);color:var(--s0)}.stg1{background:var(--s1s);color:var(--s1)}.stg2{background:var(--s2s);color:var(--s2)}
.dex-bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--cream) 35%);padding:12px;display:flex;justify-content:center;gap:8px}
.dex-bar .btn{box-shadow:0 4px 0 #15803d}
.dex-bar .btn-sec{background:#fff;color:var(--ink);border:1px solid var(--cline);box-shadow:0 3px 0 #c5cdd8}
/* BATTLE */
#battle{background:#1c2830;position:relative}
#battleCanvas{display:block;width:100%;height:100%;touch-action:none}
.b-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:12px;z-index:5;pointer-events:none}
.b-card{background:rgba(255,255,255,.93);color:#1a1a1a;border-radius:10px;padding:8px 12px;min-width:140px;max-width:46%;box-shadow:0 2px 10px rgba(0,0,0,.35);border:2px solid #333}
.b-card.en{border-color:#e11d48}
.b-card.pl{border-color:#2563eb;text-align:right}
.b-card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.78rem}
.b-card.pl .row1{flex-direction:row-reverse}
.b-card .bn{font-weight:700;font-size:.95rem}
.b-card .btag{font-size:.7rem;color:#666;background:#eee;padding:1px 6px;border-radius:4px}
.b-card .blv{font-size:.72rem;color:#555;margin-top:2px}
.b-card .bhp-label{font-size:.65rem;color:#666;display:flex;justify-content:space-between;margin-top:4px}
.b-card.pl .bhp-label{flex-direction:row-reverse}
.b-card .bhp-bar{height:12px;background:#ddd;border-radius:6px;overflow:hidden;border:1px solid #999;margin-top:2px}
.b-card .bhp-fill{height:100%;background:linear-gradient(180deg,#6ee7a8,#22c55e);width:100%}
.b-bench{position:absolute;top:78px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;pointer-events:none;gap:8px}
.b-bench .side{display:flex;gap:4px;flex-wrap:wrap;max-width:48%}
.b-bench .side.r{justify-content:flex-end}
.b-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.b-dot.faint{background:#64748b}.b-dot.active{box-shadow:0 0 0 2px #fbbf24}
.b-pad{position:absolute;bottom:18px;left:14px;width:130px;height:130px;z-index:6;touch-action:none}
.b-pad-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);position:relative}
.b-pad-base::before,.b-pad-base::after{content:"";position:absolute;background:rgba(255,255,255,.15)}
.b-pad-base::before{width:3px;height:70%;left:50%;top:15%;transform:translateX(-50%)}
.b-pad-base::after{height:3px;width:70%;top:50%;left:15%;transform:translateY(-50%)}
.b-pad-knob{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(255,255,255,.7);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
.b-pad-label{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.65rem;color:rgba(255,255,255,.7)}
.b-actions{position:absolute;bottom:22px;right:16px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:6}
.cd-btn{width:72px;height:72px;border-radius:50%;position:relative;border:3px solid #334155;box-shadow:0 4px 0 #1e293b,0 6px 16px rgba(0,0,0,.4);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.cd-btn.atk{background:radial-gradient(circle at 35% 30%,#fecaca,#ef4444);border-color:#991b1b;box-shadow:0 4px 0 #7f1d1d,0 6px 16px rgba(0,0,0,.4)}
.cd-btn.skl{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b);border-color:#92400e;box-shadow:0 4px 0 #78350f,0 6px 16px rgba(0,0,0,.4)}
.cd-btn.sw{width:56px;height:56px;background:radial-gradient(circle at 35% 30%,#c4b5fd,#7c3aed);border-color:#5b21b6;box-shadow:0 3px 0 #4c1d95,0 4px 12px rgba(0,0,0,.4)}
.cd-btn .icon{font-size:1.35rem;line-height:1}
.cd-btn.sw .icon{font-size:1.1rem}
.cd-btn .lbl{font-size:.62rem;font-weight:700;margin-top:2px}
.cd-btn .cd-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cd-btn.cooling{filter:grayscale(.7);opacity:.8}
.cd-btn .cd-num{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.45);border-radius:50%;pointer-events:none}
.cd-btn .cd-num.on{display:flex}
.b-act-hint{font-size:.6rem;color:rgba(255,255,255,.65);text-align:center;margin-top:-4px}
.b-toast{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);font-size:1.1rem;font-weight:700;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none;z-index:7;opacity:0;transition:opacity .2s}
.b-toast.show{opacity:1}
.b-result{position:absolute;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;text-align:center;padding:24px}
.b-result.show{display:flex}
.b-result h2{font-size:2.2rem;margin-bottom:8px}
.b-result.win h2{color:var(--accent)}.b-result.lose h2{color:var(--danger)}
.b-result .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.switch-panel{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;touch-action:pan-y;overflow-y:auto}
.switch-panel.show{display:flex}
.switch-panel h3{color:var(--accent);margin-bottom:10px}
.type-一般{background:#a8a29e;color:#1c1917}.type-火{background:#f87171;color:#450a0a}
.type-水{background:#60a5fa;color:#1e3a5f}.type-草{background:#4ade80;color:#14532d}
.type-電{background:#fbbf24;color:#451a03}.type-冰{background:#a5f3fc;color:#164e63}
.type-格鬥{background:#c2410c;color:#fff7ed}.type-毒{background:#c084fc;color:#3b0764}
.type-地面{background:#d6a56a;color:#451a03}.type-飛行{background:#a5b4fc;color:#1e1b4b}
.type-超能力{background:#f0abfc;color:#701a75}.type-蟲{background:#a3e635;color:#365314}
.type-岩石{background:#a8a29e;color:#1c1917}.type-幽靈{background:#818cf8;color:#1e1b4b}
.type-龍{background:#6366f1;color:#eef2ff}.type-惡{background:#57534e;color:#fafaf9}
.type-鋼{background:#94a3b8;color:#0f172a}.type-妖精{background:#f9a8d4;color:#831843}
@media(min-width:481px){#app:not(.battle-mode):not(.dex-mode){border-left:1px solid var(--border);border-right:1px solid var(--border)}}
@media(orientation:landscape) and (max-height:500px){
  .b-pad{width:110px;height:110px;bottom:10px;left:10px}
  .cd-btn{width:62px;height:62px}.cd-btn.sw{width:48px;height:48px}
  .b-card{padding:6px 10px;min-width:120px}
}
</style>
</head>
<body>
<div id="app">
  <div id="title" class="screen active">
    <canvas class="title-art" id="titleArt" width="120" height="120"></canvas>
    <div class="logo">波克萌樂園</div>
    <div class="subtitle">組隊伍 · 逛樂園 · 即時對戰</div>
    <p class="disclaimer">原創遊戲「波克萌樂園」，與任天堂／寶可夢官方無關。靈感僅來自粉絲圖鑑的「譜系／屬性瀏覽」體驗，不含任何官方名稱、圖像或招式。</p>
    <button class="btn" id="btnStart">開始冒險</button>
    <div class="btn-row"><button class="btn btn-sm btn-sec" id="btnDexTitle">波克萌圖鑑</button></div>
  </div>
  <div id="pick" class="screen">
    <div class="pick-head">
      <h2>組建隊伍</h2>
      <p>挑選 1～3 隻<strong>基礎型</strong>夥伴（點選順序＝出戰順序）</p>
      <div class="party-slots" id="partySlots"></div>
    </div>
    <div class="roster" id="roster"></div>
    <div class="pick-bar">
      <button class="btn btn-sm btn-sec" id="btnPickClear">清空</button>
      <button class="btn btn-sm" id="btnConfirmPick" disabled>確認隊伍</button>
    </div>
  </div>
  <div id="dex" class="screen">
    <div class="dex-top">
      <h2>波克萌圖鑑</h2>
      <div class="hint">原創夥伴 · 依屬性篩選 · 譜系以「→」串起</div>
      <div class="dex-tabs">
        <button class="dtab on" data-tab="all">全部</button>
        <button class="dtab" data-tab="line">譜系</button>
        <button class="dtab" data-tab="stage">進化程度</button>
      </div>
      <div class="dex-chips" id="dexTypeChips"></div>
    </div>
    <div class="dex-body">
      <div class="dex-info" id="dexInfo"></div>
      <div id="dexList"></div>
    </div>
    <div class="dex-bar"><button class="btn btn-sm btn-sec" id="btnDexBack">返回</button></div>
  </div>
  <div id="map" class="screen">
    <canvas id="mapCanvas"></canvas>
    <div class="hud">
      <div>
        <div class="hud-chip"><div class="hud-party" id="hudParty">—</div></div>
        <div class="hud-chip buff" id="hudBuff" style="display:none"></div>
      </div>
      <div class="hud-chip">WASD／方向鍵</div>
    </div>
    <div class="zone-tag" id="zoneTag">入口廣場</div>
    <div class="dialog" id="dialog"><h3 id="dlgTitle"></h3><p id="dlgBody"></p><div class="acts" id="dlgActs"></div></div>
    <div class="deploy" id="deploy">
      <h2>出戰選配</h2>

const TW=28,TH=26,TS=32;
function zoneAt(tx,ty){
  if(ty>=18&&tx>=11&&tx<=19)return{id:'arena',n:'對戰競技場',buff:null};
  if(tx<=8&&ty<=8)return{id:'fire',n:'火焰區',buff:'火'};
  if(tx>=18&&ty<=9)return{id:'water',n:'水舞湖',buff:'水'};
  if(tx>=18&&ty>=12&&ty<18)return{id:'grass',n:'青草丘',buff:'草'};
  if(tx<=9&&ty>=12&&ty<18)return{id:'thunder',n:'雷鳴丘',buff:'電'};
  return{id:'gate',n:'入口廣場',buff:null};
}
function genMap(){
  const g=Array.from({length:TH},()=>Array(TW).fill(0));
  for(let x=4;x<24;x++){g[14][x]=1;g[13][x]=1;}
  for(let y=4;y<22;y++){g[y][13]=1;g[y][14]=1;}
  for(let y=12;y<17;y++)for(let x=10;x<18;x++)g[y][x]=1;
  for(let y=3;y<8;y++)for(let x=3;x<9;x++)if((x+y)%3===0)g[y][x]=4;
  for(let y=3;y<9;y++)for(let x=19;x<26;x++)g[y][x]=3;
  for(let y=13;y<18;y++)for(let x=19;x<26;x++)if((x*y)%5===0)g[y][x]=6;
  for(let y=13;y<18;y++)for(let x=3;x<9;x++)if((x+y)%4===0)g[y][x]=5;
  for(let y=19;y<24;y++)for(let x=11;x<20;x++)g[y][x]=8;
  for(let x=0;x<TW;x++){g[0][x]=2;g[TH-1][x]=2;}
  for(let y=0;y<TH;y++){g[y][0]=2;g[y][TW-1]=2;}
  [[5,10],[7,11],[9,9],[16,4],[17,10],[22,12],[4,16],[10,20],[21,20],[6,22]].forEach(([x,y])=>{if(g[y])g[y][x]=2;});
  g[12][9]=7;g[12][18]=7;g[16][9]=7;g[16][18]=7;
  return g;
}
const MAP=genMap();
function walkable(tx,ty){if(tx<0||ty<0||tx>=TW||ty>=TH)return false;const t=MAP[ty][tx];return t!==2&&t!==3;}

function drawCreature(ctx,c,w,h,opts={}){
  ctx.clearRect(0,0,w,h);
  const [main,light,dark]=c.pal,cx=w/2,cy=h/2+(opts.bob||0),sc=(opts.scale||1)*(w/96);
  ctx.save();ctx.translate(cx,cy);if(opts.flip)ctx.scale(-1,1);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,28,22,7,0,0,Math.PI*2);ctx.fill();
  const body=shape=>{ctx.fillStyle=main;ctx.strokeStyle=dark;ctx.lineWidth=2;shape();ctx.fill();ctx.stroke();};
  if(c.id==='flame_bunny'||c.id==='blaze_hare'){
    ctx.fillStyle=main;ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(-10,-40);ctx.lineTo(-4,-16);ctx.fill();
    ctx.beginPath();ctx.moveTo(14,-18);ctx.lineTo(10,-40);ctx.lineTo(4,-16);ctx.fill();
    ctx.fillStyle='#ffab91';ctx.beginPath();ctx.moveTo(-11,-22);ctx.lineTo(-10,-36);ctx.lineTo(-7,-20);ctx.fill();
    ctx.beginPath();ctx.moveTo(11,-22);ctx.lineTo(10,-36);ctx.lineTo(7,-20);ctx.fill();
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,c.stage?22:20,c.stage?24:22,0,0,Math.PI*2);});
    ctx.fillStyle='#ff8a80';ctx.beginPath();ctx.arc(-14,4,5,0,Math.PI*2);ctx.arc(14,4,5,0,Math.PI*2);ctx.fill();
  }else if(c.id==='bubble_porpoise'||c.id==='tide_song'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,c.stage?26:24,c.stage?18:16,0,0,Math.PI*2);});
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(-4,-12);ctx.lineTo(0,-28);ctx.lineTo(6,-12);ctx.fill();
    ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(20,4,10,7,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(28,-10,4,0,Math.PI*2);ctx.arc(34,-18,3,0,Math.PI*2);ctx.fill();
  }else if(c.id==='sprout_fox'||c.id==='leaf_fox'){
    ctx.fillStyle=main;ctx.beginPath();ctx.moveTo(-16,-10);ctx.lineTo(-12,-32);ctx.lineTo(-4,-14);ctx.fill();
    ctx.beginPath();ctx.moveTo(16,-10);ctx.lineTo(12,-32);ctx.lineTo(4,-14);ctx.fill();
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,c.stage?20:18,c.stage?22:20,0,0,Math.PI*2);});
    ctx.fillStyle='#66bb6a';ctx.beginPath();ctx.ellipse(-4,-26,7,4,-.5,0,Math.PI*2);ctx.ellipse(4,-28,7,4,.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(-22,10,12,10,0,0,Math.PI*2);ctx.fill();
  }else if(c.t==='電'){
    body(()=>{ctx.beginPath();ctx.arc(0,2,c.stage?26:24,0,Math.PI*2);});
    ctx.fillStyle=light;ctx.beginPath();ctx.arc(-6,-4,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(22,-8);ctx.lineTo(34,0);ctx.lineTo(24,2);ctx.lineTo(36,14);ctx.lineTo(18,4);ctx.lineTo(26,0);ctx.closePath();ctx.fill();
  }else if(c.t==='岩石'){
    body(()=>{ctx.beginPath();ctx.moveTo(-18,-10);ctx.lineTo(0,-22);ctx.lineTo(20,-8);ctx.lineTo(22,14);ctx.lineTo(-4,22);ctx.lineTo(-22,10);ctx.closePath();});
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(-10,-18);ctx.lineTo(-18,-38);ctx.lineTo(-2,-20);ctx.fill();
    ctx.beginPath();ctx.moveTo(10,-16);ctx.lineTo(20,-36);ctx.lineTo(4,-18);ctx.fill();
  }else if(c.t==='飛行'){
    ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(-28,0,18,10,-.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(28,0,18,10,.3,0,Math.PI*2);ctx.fill();
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,16,18,0,0,Math.PI*2);});
    ctx.fillStyle='#ffb74d';ctx.beginPath();ctx.moveTo(12,2);ctx.lineTo(26,6);ctx.lineTo(12,10);ctx.closePath();ctx.fill();
  }else if(c.t==='冰'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,20,18,0,0,Math.PI*2);});
    ctx.fillStyle=light;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(8,-8);ctx.lineTo(-8,-8);ctx.fill();
    ctx.strokeStyle=dark;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(16,8);ctx.stroke();
  }else if(c.t==='毒'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,4,24,14,0,0,Math.PI*2);});
    ctx.fillStyle=dark;ctx.beginPath();ctx.arc(22,0,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e1bee7';ctx.beginPath();ctx.arc(-8,-2,4,0,Math.PI*2);ctx.fill();
  }else if(c.t==='蟲'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,6,18,14,0,0,Math.PI*2);});
    if(c.stage){ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(-20,-4,14,8,-.4,0,Math.PI*2);ctx.ellipse(20,-4,14,8,.4,0,Math.PI*2);ctx.fill();}
    else{ctx.fillStyle=dark;ctx.fillRect(-4,-16,8,10);}
  }else if(c.t==='地面'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,6,22,16,0,0,Math.PI*2);});
    ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(0,-4,14,8,0,0,Math.PI*2);ctx.fill();
  }else if(c.t==='鋼'){
    body(()=>{ctx.beginPath();ctx.moveTo(-16,-8);ctx.lineTo(0,-20);ctx.lineTo(16,-8);ctx.lineTo(18,14);ctx.lineTo(-18,14);ctx.closePath();});
    ctx.fillStyle=light;ctx.fillRect(-6,-6,12,10);
  }else if(c.t==='幽靈'){
    body(()=>{ctx.beginPath();ctx.arc(0,-2,18,Math.PI,0);ctx.lineTo(18,16);ctx.lineTo(10,10);ctx.lineTo(0,18);ctx.lineTo(-10,10);ctx.lineTo(-18,16);ctx.closePath();});
    ctx.fillStyle='#fff59d';ctx.beginPath();ctx.arc(0,-6,6,0,Math.PI*2);ctx.fill();
  }else if(c.t==='龍'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,20,18,0,0,Math.PI*2);});
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(-8,-16);ctx.lineTo(-4,-34);ctx.lineTo(2,-16);ctx.fill();
    ctx.beginPath();ctx.moveTo(8,-16);ctx.lineTo(12,-32);ctx.lineTo(2,-14);ctx.fill();
    ctx.fillStyle=main;ctx.beginPath();ctx.moveTo(16,8);ctx.quadraticCurveTo(34,0,38,14);ctx.quadraticCurveTo(24,12,14,10);ctx.fill();
  }else if(c.t==='妖精'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,4,18,20,0,0,Math.PI*2);});
    ctx.fillStyle=light;ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(6,-16);ctx.lineTo(-6,-16);ctx.fill();
    ctx.fillStyle='#fff';ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(-20,-10,3,0,Math.PI*2);ctx.arc(22,-14,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }else if(c.t==='格鬥'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,18,20,0,0,Math.PI*2);});
    ctx.fillStyle=main;ctx.beginPath();ctx.arc(-22,4,8,0,Math.PI*2);ctx.arc(22,4,8,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=dark;ctx.lineWidth=2;ctx.beginPath();ctx.arc(-22,4,8,0,Math.PI*2);ctx.arc(22,4,8,0,Math.PI*2);ctx.stroke();
  }else if(c.t==='惡'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,2,18,20,0,0,Math.PI*2);});
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(-14,-12);ctx.lineTo(-18,-28);ctx.lineTo(-6,-14);ctx.fill();
    ctx.beginPath();ctx.moveTo(14,-12);ctx.lineTo(18,-28);ctx.lineTo(6,-14);ctx.fill();
  }else if(c.t==='超能力'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,6,20,16,0,0,Math.PI*2);});
    ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(0,-10,16,12,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=dark;ctx.beginPath();ctx.arc(0,-10,8,0,Math.PI*2);ctx.stroke();
  }else if(c.t==='一般'){
    body(()=>{ctx.beginPath();ctx.ellipse(0,4,20,18,0,0,Math.PI*2);});
    ctx.fillStyle=main;ctx.beginPath();ctx.moveTo(-12,-14);ctx.lineTo(-16,-30);ctx.lineTo(-4,-16);ctx.fill();
    ctx.beginPath();ctx.moveTo(12,-14);ctx.lineTo(16,-30);ctx.lineTo(4,-16);ctx.fill();
    ctx.fillStyle=light;ctx.beginPath();ctx.ellipse(0,10,10,8,0,0,Math.PI*2);ctx.fill();
  }else body(()=>{ctx.beginPath();ctx.ellipse(0,2,20,20,0,0,Math.PI*2);});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-2,5,0,Math.PI*2);ctx.arc(7,-2,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-6,-2,2.5,0,Math.PI*2);ctx.arc(8,-2,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function renderPartySlots(){
  const root=document.getElementById('partySlots');root.innerHTML='';
  for(let i=0;i<3;i++){
    const slot=document.createElement('div');
    const id=S.pickSel[i];
    if(id){
      const c=byId(id);slot.className='party-slot filled';
      const cv=document.createElement('canvas');cv.width=40;cv.height=40;
      drawCreature(cv.getContext('2d'),c,40,40,{scale:0.45});
      const ord=document.createElement('div');ord.className='ord';ord.textContent=(i+1)+'. '+c.n;
      slot.append(cv,ord);
    }else{slot.className='party-slot';slot.textContent='空位 '+(i+1);}
    root.appendChild(slot);
  }
  document.getElementById('btnConfirmPick').disabled=S.pickSel.length===0;
}
function buildRoster(){
  const root=document.getElementById('roster');root.innerHTML='';
  S.pickSel=S.fromCenter?S.party.map(p=>p.id).slice():[];
  bases().forEach(c=>{
    const card=document.createElement('div');card.className='card';card.dataset.id=c.id;
    const cv=document.createElement('canvas');cv.width=80;cv.height=80;
    drawCreature(cv.getContext('2d'),c,80,80,{scale:0.85});card.appendChild(cv);
    const name=document.createElement('div');name.className='name';name.textContent=c.n;
    const type=document.createElement('span');type.className='type type-'+c.t;type.textContent=c.t;
    const stg=document.createElement('span');stg.className='stage';stg.textContent=STAGE_N[c.stage];
    const fl=document.createElement('div');fl.className='flavor';fl.textContent=c.flavor;
    const st=document.createElement('div');st.className='stats';
    st.innerHTML='<span>HP <b>'+c.hp+'</b></span><span>攻擊 <b>'+c.atk+'</b></span><span>防禦 <b>'+c.def+'</b></span><span>速度 <b>'+c.spd+'</b></span>';
    const mv=document.createElement('div');mv.className='moves-mini';mv.textContent=c.moves.map(m=>MOVES[m].n).join(' · ');
    const lin=document.createElement('div');lin.className='moves-mini';lin.style.color='var(--muted)';lin.textContent='譜系 '+lineageLabel(c.line);
    card.append(name,type,stg,fl,st,mv,lin);
    card.addEventListener('click',()=>togglePick(c.id));
    root.appendChild(card);
  });
  syncPickCards();renderPartySlots();
}
function syncPickCards(){
  document.querySelectorAll('#roster .card').forEach(card=>{
    const i=S.pickSel.indexOf(card.dataset.id);
    card.classList.toggle('sel',i>=0);
    if(i>=0)card.dataset.ord=String(i+1);else card.removeAttribute('data-ord');
  });
}
function togglePick(id){
  const i=S.pickSel.indexOf(id);
  if(i>=0)S.pickSel.splice(i,1);
  else if(S.pickSel.length<3)S.pickSel.push(id);
  else{S.pickSel.shift();S.pickSel.push(id);}
  syncPickCards();renderPartySlots();
}
function confirmPick(){
  if(!S.pickSel.length)return;
  const prev=new Map(S.party.map(p=>[p.id,p.hp]));
  S.party=S.pickSel.map(id=>{
    const c=byId(id);const old=prev.get(id);
    return{id,hp:old!=null?Math.min(old,c.hp):c.hp};
  });
  updateHudParty();
  if(S.fromCenter){S.fromCenter=false;show('map');openDialog('夥伴中心','隊伍已更新！目前 '+S.party.length+' 隻同行。',[ {l:'好',fn:closeDialog}]);}
  else{S.px=13.5;S.py=15.5;show('map');openDialog('園區導覽員','歡迎來到波克萌樂園！你帶了 '+S.party.length+' 隻夥伴。對戰前可「出戰選配」；倒下會自動換下一位。移動＋攻擊（5秒）＋招式（10秒）！',[ {l:'出發！',fn:closeDialog}]);}
}

function openDex(){S.dexTab='all';S.dexTypes=new Set();show('dex');}
function renderDex(){
  document.querySelectorAll('.dtab').forEach(t=>t.classList.toggle('on',t.dataset.tab===S.dexTab));
  const chips=document.getElementById('dexTypeChips');
  chips.innerHTML='<span class="lab">屬性</span>';
  TYPES.forEach(t=>{
    const b=document.createElement('span');b.className='dchip'+(S.dexTypes.has(t)?' on':'');b.textContent=t;
    b.onclick=()=>{S.dexTypes.has(t)?S.dexTypes.delete(t):S.dexTypes.add(t);renderDex();};
    chips.appendChild(b);
  });
  const clr=document.createElement('span');clr.className='dchip';clr.textContent='清除';clr.onclick=()=>{S.dexTypes.clear();renderDex();};chips.appendChild(clr);
  let list=CREATURES.slice();
  if(S.dexTypes.size)list=list.filter(c=>S.dexTypes.has(c.t));
  document.getElementById('dexInfo').textContent='顯示 '+list.length+' / '+CREATURES.length+' 隻 · '+LINE_ORDER.length+' 條譜系';
  const root=document.getElementById('dexList');root.innerHTML='';
  const mkCard=c=>{
    const d=document.createElement('div');d.className='dcard';
    const cv=document.createElement('canvas');cv.width=72;cv.height=72;
    drawCreature(cv.getContext('2d'),c,72,72,{scale:0.75});
    const nm=document.createElement('div');nm.className='nm';nm.textContent=c.n;
    const meta=document.createElement('div');meta.className='meta';
    meta.innerHTML='<span class="type type-'+c.t+'">'+c.t+'</span> <span class="stg stg'+c.stage+'">'+STAGE_N[c.stage]+'</span>';
    const st=document.createElement('div');st.className='meta';st.textContent='HP'+c.hp+' 攻'+c.atk+' 防'+c.def+' 速'+c.spd;
    const mv=document.createElement('div');mv.className='meta';mv.textContent=c.moves.map(m=>MOVES[m].n).join(' · ');
    const lin=document.createElement('div');lin.className='lin';lin.innerHTML='<b>譜系</b> '+lineageLabel(c.line);
    const fl=document.createElement('div');fl.className='meta';fl.style.marginTop='4px';fl.textContent=c.flavor;
    d.append(cv,nm,meta,st,mv,lin,fl);return d;
  };
  if(S.dexTab==='line'){
    LINE_ORDER.forEach(line=>{
      const g=list.filter(c=>c.line===line);if(!g.length)return;
      const sec=document.createElement('div');sec.className='dex-group';
      const h=document.createElement('h3');h.textContent=lineageLabel(line)+'（'+g.length+'）';
      const grid=document.createElement('div');grid.className='dex-grid';
      g.sort((a,b)=>a.stage-b.stage).forEach(c=>grid.appendChild(mkCard(c)));
      sec.append(h,grid);root.appendChild(sec);
    });
  }else if(S.dexTab==='stage'){
    [0,1,2].forEach(s=>{
      const g=list.filter(c=>c.stage===s);if(!g.length)return;
      const sec=document.createElement('div');sec.className='dex-group';
      const h=document.createElement('h3');h.textContent=STAGE_N[s]+'（'+g.length+'）';
      const grid=document.createElement('div');grid.className='dex-grid';
      g.forEach(c=>grid.appendChild(mkCard(c)));
      sec.append(h,grid);root.appendChild(sec);
    });
  }else{
    const grid=document.createElement('div');grid.className='dex-grid';
    list.forEach(c=>grid.appendChild(mkCard(c)));root.appendChild(grid);
  }
}

const mapCv=document.getElementById('mapCanvas'),mapCtx=mapCv.getContext('2d');
let camX=0,camY=0,animT=0;
function resizeMap(){
  const app=document.getElementById('app'),dpr=Math.min(devicePixelRatio||1,2);
  mapCv.width=app.clientWidth*dpr;mapCv.height=app.clientHeight*dpr;
  mapCv.style.width=app.clientWidth+'px';mapCv.style.height=app.clientHeight+'px';
  mapCtx.setTransform(dpr,0,0,dpr,0,0);
}
function tileColor(t,x,y){
  const z=zoneAt(x,y);
  if(t===1)return'#c4a574';if(t===3)return'#2b6cb0';if(t===4)return'#c05621';if(t===5)return'#718096';if(t===6)return'#276749';if(t===7)return'#dd6b20';if(t===8)return'#4a5568';
  if(z.id==='fire')return'#5c3d2e';if(z.id==='water')return'#2c5282';if(z.id==='grass')return'#276749';if(z.id==='thunder')return'#744210';if(z.id==='arena')return'#2d3748';
  return'#2f6b3a';
}
function drawMap(){
  if(S.screen!=='map')return;
  const W=mapCv.clientWidth,H=mapCv.clientHeight;
  camX=Math.max(0,Math.min(TW*TS-W,S.px*TS-W/2));camY=Math.max(0,Math.min(TH*TS-H,S.py*TS-H/2));
  mapCtx.fillStyle='#0d1f14';mapCtx.fillRect(0,0,W,H);
  const x0=Math.floor(camX/TS),y0=Math.floor(camY/TS),x1=Math.min(TW-1,x0+Math.ceil(W/TS)+1),y1=Math.min(TH-1,y0+Math.ceil(H/TS)+1);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const t=MAP[y][x],sx=x*TS-camX,sy=y*TS-camY,col=tileColor(t,x,y);
    if(col){mapCtx.fillStyle=col;mapCtx.fillRect(sx,sy,TS+.5,TS+.5);if((x+y)%2===0&&(t===0||t===1||t===8)){mapCtx.fillStyle='rgba(255,255,255,.04)';mapCtx.fillRect(sx,sy,TS,TS);}}
    if(t===2){mapCtx.fillStyle='#1a3a28';mapCtx.fillRect(sx+12,sy+18,8,14);mapCtx.fillStyle='#22863a';mapCtx.beginPath();mapCtx.arc(sx+16,sy+14,12,0,Math.PI*2);mapCtx.fill();mapCtx.fillStyle='#2ea043';mapCtx.beginPath();mapCtx.arc(sx+12,sy+10,8,0,Math.PI*2);mapCtx.fill();}
    if(t===3){mapCtx.fillStyle='rgba(144,205,244,.25)';mapCtx.fillRect(sx+4,sy+8,10,6);}
    if(t===4){mapCtx.fillStyle='#ed8936';mapCtx.beginPath();mapCtx.ellipse(sx+16,sy+20,10,4,0,0,Math.PI*2);mapCtx.fill();}
    if(t===5){mapCtx.fillStyle='#a0aec0';mapCtx.beginPath();mapCtx.moveTo(sx+8,sy+24);mapCtx.lineTo(sx+16,sy+8);mapCtx.lineTo(sx+26,sy+24);mapCtx.fill();}
    if(t===6){mapCtx.fillStyle='#68d391';mapCtx.fillRect(sx+14,sy+16,4,10);mapCtx.fillStyle='#f687b3';mapCtx.beginPath();mapCtx.arc(sx+16,sy+14,5,0,Math.PI*2);mapCtx.fill();}
    if(t===7){mapCtx.fillStyle='#c05621';mapCtx.fillRect(sx+4,sy+12,24,16);mapCtx.fillStyle='#f6ad55';mapCtx.beginPath();mapCtx.moveTo(sx+2,sy+14);mapCtx.lineTo(sx+16,sy+4);mapCtx.lineTo(sx+30,sy+14);mapCtx.fill();}
    if(t===8&&(x===11||x===19||y===19||y===23)){mapCtx.fillStyle='#fbbf24';mapCtx.fillRect(sx,sy,TS,3);}
  }
  mapCtx.font='bold 11px "Noto Sans TC",sans-serif';mapCtx.textAlign='center';
  [{x:5.5,y:5,label:'🔥 火焰區'},{x:22,y:5.5,label:'💧 水舞湖'},{x:5.5,y:15,label:'⚡ 雷鳴丘'},{x:22,y:15,label:'🌿 青草丘'},{x:14.5,y:14,label:'入口廣場'},{x:15,y:21,label:'⚔ 對戰競技場'}].forEach(m=>{
    const sx=m.x*TS-camX,sy=m.y*TS-camY,tw=mapCtx.measureText(m.label).width;
    mapCtx.fillStyle='rgba(0,0,0,.45)';mapCtx.fillRect(sx-tw/2-6,sy-12,tw+12,18);mapCtx.fillStyle='#e8f5ee';mapCtx.fillText(m.label,sx,sy);
  });
  NPCS.forEach(npc=>{
    const sx=npc.x*TS-camX+TS/2,sy=npc.y*TS-camY+TS/2;
    mapCtx.fillStyle='rgba(0,0,0,.3)';mapCtx.beginPath();mapCtx.ellipse(sx,sy+10,10,4,0,0,Math.PI*2);mapCtx.fill();
    mapCtx.fillStyle=npc.color;mapCtx.beginPath();mapCtx.arc(sx,sy-2,10,0,Math.PI*2);mapCtx.fill();
    mapCtx.fillStyle='#fff';mapCtx.beginPath();mapCtx.arc(sx-3,sy-4,2,0,Math.PI*2);mapCtx.arc(sx+3,sy-4,2,0,Math.PI*2);mapCtx.fill();
    mapCtx.font='9px "Noto Sans TC",sans-serif';mapCtx.fillStyle='#fff';mapCtx.fillText(npc.n,sx,sy-17);
  });
  const L=leader();
  if(L){
    const ang=S.facing*Math.PI/2,fx=S.px-Math.sin(ang)*.7,fy=S.py+Math.cos(ang)*.7;
    const tmp=document.createElement('canvas');tmp.width=48;tmp.height=48;
    drawCreature(tmp.getContext('2d'),L,48,48,{scale:0.55});
    mapCtx.drawImage(tmp,fx*TS-camX+TS/2-24,fy*TS-camY+TS/2-28+Math.sin(animT*.15)*2);
  }
  const sx=S.px*TS-camX+TS/2,sy=S.py*TS-camY+TS/2;
  mapCtx.fillStyle='rgba(0,0,0,.3)';mapCtx.beginPath();mapCtx.ellipse(sx,sy+12,10,4,0,0,Math.PI*2);mapCtx.fill();
  mapCtx.fillStyle='#38bdf8';mapCtx.beginPath();mapCtx.roundRect(sx-8,sy-4,16,18,4);mapCtx.fill();
  mapCtx.fillStyle='#fde68a';mapCtx.beginPath();mapCtx.arc(sx,sy-10,9,0,Math.PI*2);mapCtx.fill();
  mapCtx.fillStyle='#22c55e';mapCtx.beginPath();mapCtx.arc(sx,sy-14,8,Math.PI,0);mapCtx.fill();mapCtx.fillRect(sx-10,sy-15,20,3);
  mapCtx.fillStyle='#222';const ex=S.facing===3?2:S.facing===1?-2:0,ey=S.facing===0?1:S.facing===2?-1:0;
  mapCtx.beginPath();mapCtx.arc(sx-3+ex,sy-11+ey,1.5,0,Math.PI*2);mapCtx.arc(sx+3+ex,sy-11+ey,1.5,0,Math.PI*2);mapCtx.fill();
}
function updateZoneHud(){
  const z=zoneAt(Math.floor(S.px),Math.floor(S.py));
  document.getElementById('zoneTag').textContent=z.n;
  if(z.buff){S.zoneBuff=z.buff;const el=document.getElementById('hudBuff');el.style.display='block';el.textContent='地形加持：'+z.buff+'屬性下次攻擊 +10%';}
}
function tryMove(dx,dy,dt){
  if(S.dialogOpen||document.getElementById('deploy').classList.contains('show'))return;
  const sp=3.2*dt;let nx=S.px+dx*sp,ny=S.py+dy*sp;
  if(Math.abs(dx)>Math.abs(dy))S.facing=dx>0?3:1;else if(dy!==0)S.facing=dy>0?0:2;
  const r=.28;
  if(walkable(Math.floor(nx+r),Math.floor(S.py+r))&&walkable(Math.floor(nx-r),Math.floor(S.py+r))&&walkable(Math.floor(nx+r),Math.floor(S.py-r))&&walkable(Math.floor(nx-r),Math.floor(S.py-r)))S.px=nx;
  if(walkable(Math.floor(S.px+r),Math.floor(ny+r))&&walkable(Math.floor(S.px-r),Math.floor(ny+r))&&walkable(Math.floor(S.px+r),Math.floor(ny-r))&&walkable(Math.floor(S.px-r),Math.floor(ny-r)))S.py=ny;
  updateZoneHud();
}
function nearestNpc(){let best=null,bd=2.2;NPCS.forEach(n=>{const d=Math.hypot(n.x+.5-S.px,n.y+.5-S.py);if(d<bd){bd=d;best=n;}});return best;}
function openDialog(title,body,acts){
  S.dialogOpen=true;document.getElementById('dlgTitle').textContent=title;document.getElementById('dlgBody').textContent=body;
  const a=document.getElementById('dlgActs');a.innerHTML='';
  acts.forEach(act=>{const b=document.createElement('button');b.className='btn btn-sm'+(act.sec?' btn-sec':'');b.textContent=act.l;b.onclick=act.fn;a.appendChild(b);});
  document.getElementById('dialog').style.display='block';
}
function closeDialog(){S.dialogOpen=false;document.getElementById('dialog').style.display='none';}
function healParty(){S.party.forEach(p=>{const c=byId(p.id);p.hp=c.hp;});updateHudParty();}
function interact(){
  if(S.dialogOpen||document.getElementById('deploy').classList.contains('show'))return;
  const npc=nearestNpc();
  if(!npc){openDialog('提示','附近沒有可互動的對象。靠近帶名字的人再按「互動」。',[{l:'知道了',fn:closeDialog}]);return;}
  if(npc.talk==='welcome')openDialog(npc.n,'樂園有火焰區、水舞湖、青草丘、雷鳴丘與競技場。組最多 3 隻隊伍；開戰前可出戰選配。對戰即時：移動＋攻擊（5秒）＋招式（10秒）；可換手。',[{l:'謝謝',fn:closeDialog}]);
  else if(npc.talk==='heal')openDialog(npc.n,'讓我幫你的隊伍恢復精神吧～',[
    {l:'全體恢復',fn:()=>{healParty();closeDialog();openDialog(npc.n,'隊伍體力完全恢復了！',[{l:'謝謝',fn:closeDialog}]);}},
    {l:'不用了',sec:true,fn:closeDialog}]);
  else if(npc.talk==='center')openDialog(npc.n,'要重新編排同行隊伍嗎？',[
    {l:'編輯隊伍',fn:()=>{closeDialog();S.fromCenter=true;buildRoster();show('pick');}},
    {l:'離開',sec:true,fn:closeDialog}]);
  else if(npc.talk==='battle'||npc.talk==='arena'){
    let foes;
    if(npc.talk==='arena'){
      const a=ARENA_POOL[Math.floor(Math.random()*ARENA_POOL.length)];
      const b=ARENA_POOL.filter(x=>x!==a)[Math.floor(Math.random()*(ARENA_POOL.length-1))];
      foes=[a,b];
    }else foes=npc.foes.slice();
    const names=foes.map(id=>byId(id).n).join('、');
    openDialog(npc.n,(npc.talk==='arena'?'競技場隨機對手：':'對手隊伍：')+names+'。請選配出戰成員。',[
      {l:'出戰選配',fn:()=>{closeDialog();openDeploy(foes,npc);}},
      {l:'下次再說',sec:true,fn:closeDialog}]);
  }
}

/* DEPLOY */
function openDeploy(foeIds,npc){
  S.pendingFoes=foeIds;S.pendingNpc=npc;
  S.deploySel=S.party.filter(p=>p.hp>0).map(p=>p.id).slice(0,3);
  if(!S.deploySel.length){openDialog('無法出戰','隊伍全員體力耗盡，請先到休息亭恢復。',[{l:'好',fn:closeDialog}]);return;}
  renderDeploy();document.getElementById('deploy').classList.add('show');
}
function renderDeploy(){
  const root=document.getElementById('deployList');root.innerHTML='';
  S.party.forEach(p=>{
    const c=byId(p.id);const i=S.deploySel.indexOf(p.id);
    const row=document.createElement('div');row.className='deploy-row'+(i>=0?' on':'')+(p.hp<=0?' faint':'');
    const badge=document.createElement('div');badge.className='ord-badge';badge.textContent=i>=0?String(i+1):'·';
    const cv=document.createElement('canvas');cv.width=48;cv.height=48;
    drawCreature(cv.getContext('2d'),c,48,48,{scale:0.5});
    const info=document.createElement('div');info.className='info';
    info.innerHTML='<div class="dn">'+c.n+'</div><div class="dmeta"><span class="type type-'+c.t+'">'+c.t+'</span> HP '+Math.max(0,p.hp)+'/'+c.hp+' · '+c.moves.map(m=>MOVES[m].n).join(' / ')+'</div>';
    row.append(badge,cv,info);
    row.onclick=()=>{
      if(p.hp<=0)return;
      const j=S.deploySel.indexOf(p.id);
      if(j>=0)S.deploySel.splice(j,1);
      else if(S.deploySel.length<3)S.deploySel.push(p.id);
      renderDeploy();
    };
    root.appendChild(row);
  });
  document.getElementById('btnDeployGo').disabled=S.deploySel.length===0;
}
function closeDeploy(){document.getElementById('deploy').classList.remove('show');S.pendingFoes=null;S.pendingNpc=null;}

/* BATTLE */
const ATK_CD=5,SKL_CD=10;
const bCv=document.getElementById('battleCanvas'),bCtx=bCv.getContext('2d');
let bW=0,bH=0,bStick={dx:0,dy:0};
function resizeBattle(){
  const app=document.getElementById('app'),dpr=Math.min(devicePixelRatio||1,2);
  bW=app.clientWidth;bH=app.clientHeight;
  bCv.width=bW*dpr;bCv.height=bH*dpr;bCv.style.width=bW+'px';bCv.style.height=bH+'px';
  bCtx.setTransform(dpr,0,0,dpr,0,0);
}
function mkFighter(c,hp,x,y,isPlayer){
  return{c,id:c.id,x,y,hp,max:c.hp,facing:isPlayer?1:-1,atkCd:0,sklCd:0,hitFlash:0,radius:28,speed:90+(c.spd-50)*0.6,isPlayer};
}
function startBattle(foeIds,npc,deployIds){
  resizeBattle();
  const plTeam=deployIds.map((id,i)=>{
    const c=byId(id);const mem=S.party.find(p=>p.id===id);
    const hp=mem?Math.max(1,mem.hp):c.hp;
    return mkFighter(c,hp,bW*(0.22+i*0.02),bH*0.55,true);
  });
  const enTeam=foeIds.map((id,i)=>{
    const c=byId(id);
    return mkFighter(c,c.hp,bW*(0.72-i*0.02),bH*(0.42+i*0.08),false);
  });
  S.battle={
    npc,foeIds,deployIds,
    plTeam,enTeam,plIdx:0,enIdx:0,
    pl:plTeam[0],en:enTeam[0],
    projectiles:[],floats:[],over:false,won:false,buff:S.zoneBuff,t:0,sprites:{},
    switching:false,mustSwitch:false
  };
  refreshActiveSprites();
  document.getElementById('bResult').classList.remove('show','win','lose');
  document.getElementById('switchPanel').classList.remove('show');
  updateBattleHud();updateCdUi();updateBenchDots();show('battle');
  if(S.battle.buff)toast('地形加持：'+S.battle.buff+' +10%');
}
function refreshActiveSprites(){
  const B=S.battle;
  ['pl','en'].forEach(k=>{
    const cv=document.createElement('canvas');cv.width=96;cv.height=96;
    drawCreature(cv.getContext('2d'),B[k].c,96,96,{flip:k==='pl'});
    B.sprites[k]=cv;
  });
  document.getElementById('enName').textContent=B.en.c.n;
  document.getElementById('plName').textContent=B.pl.c.n;
  document.getElementById('enType').textContent=B.en.c.t+'屬性';
  document.getElementById('plType').textContent=B.pl.c.t+'屬性';
}
function updateBenchDots(){
  const B=S.battle;if(!B)return;
  const fill=(el,team,idx)=>{
    el.innerHTML='';
    team.forEach((f,i)=>{
      const d=document.createElement('div');
      d.className='b-dot'+(f.hp<=0?' faint':'')+(i===idx?' active':'');
      el.appendChild(d);
    });
  };
  fill(document.getElementById('plDots'),B.plTeam,B.plIdx);
  fill(document.getElementById('enDots'),B.enTeam,B.enIdx);
}
function updateBattleHud(){
  const B=S.battle;if(!B)return;
  const set=(fill,pct,cur,max)=>{const p=Math.max(0,cur/max);document.getElementById(fill).style.width=(p*100)+'%';document.getElementById(fill).style.background=p>.5?'linear-gradient(180deg,#6ee7a8,#22c55e)':p>.25?'linear-gradient(180deg,#fde68a,#f59e0b)':'linear-gradient(180deg,#fca5a5,#ef4444)';document.getElementById(pct).textContent=Math.round(p*100)+'%';};
  set('enHp','enHpPct',B.en.hp,B.en.max);set('plHp','plHpPct',B.pl.hp,B.pl.max);
  updateBenchDots();
}
function toast(msg){const el=document.getElementById('bToast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1200);}
function drawCdRing(id,remain,total){
  const cv=document.getElementById(id),ctx=cv.getContext('2d'),s=cv.width;ctx.clearRect(0,0,s,s);
  if(remain<=0)return;
  ctx.beginPath();ctx.arc(s/2,s/2,s/2-3,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-remain/total));
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();
}
function updateCdUi(){
  const B=S.battle;if(!B)return;
  const atkN=document.getElementById('atkCd'),sklN=document.getElementById('sklCd');
  document.getElementById('btnAtk').classList.toggle('cooling',B.pl.atkCd>0);
  document.getElementById('btnSkl').classList.toggle('cooling',B.pl.sklCd>0);
  if(B.pl.atkCd>0){atkN.textContent=Math.ceil(B.pl.atkCd);atkN.classList.add('on');}else{atkN.textContent='';atkN.classList.remove('on');}
  if(B.pl.sklCd>0){sklN.textContent=Math.ceil(B.pl.sklCd);sklN.classList.add('on');}else{sklN.textContent='';sklN.classList.remove('on');}
  drawCdRing('atkRing',B.pl.atkCd,ATK_CD);drawCdRing('sklRing',B.pl.sklCd,SKL_CD);
  const alive=B.plTeam.filter(f=>f.hp>0).length;
  document.getElementById('btnSwitch').style.display=alive>=2?'flex':'none';
}
function calcDmg(atkC,defC,power,useBuff){
  const mul=typeMul(atkC.t,defC.t),rand=0.85+Math.random()*0.15;
  let raw=power*(atkC.atk/60)*mul*rand*(100/(100+defC.def));
  if(useBuff&&S.battle&&S.battle.buff===atkC.t)raw*=1.1;
  return{dmg:Math.max(1,Math.round(raw)),mul};
}
function fireShot(owner,kind){
  const move=MOVES[owner.c.moves[kind==='atk'?0:1]];
  const power=kind==='atk'?move.p*0.9:move.p*1.4;
  const target=owner.isPlayer?S.battle.en:S.battle.pl;
  const ang=Math.atan2(target.y-owner.y,target.x-owner.x);
  const dx=Math.cos(ang),dy=Math.sin(ang);
  owner.facing=dx>=0?1:-1;
  const melee=kind==='atk'&&(owner.c.t==='岩石'||owner.c.t==='草'||owner.c.t==='格鬥'||owner.c.t==='鋼');
  if(melee){
    S.battle.projectiles.push({x:owner.x+dx*40,y:owner.y+dy*40,vx:0,vy:0,life:0.2,maxLife:0.2,rad:38,owner,kind,move,power,melee:true,hit:false,color:owner.c.pal[0]});
  }else{
    const spd=kind==='skl'?260:320;
    S.battle.projectiles.push({x:owner.x+dx*22,y:owner.y+dy*10,vx:dx*spd,vy:dy*spd,life:kind==='skl'?1.15:0.75,maxLife:kind==='skl'?1.15:0.75,rad:kind==='skl'?16:11,owner,kind,move,power,melee:false,hit:false,color:owner.c.pal[0]});
  }
}
function tryPlayerAtk(){const B=S.battle;if(!B||B.over||B.switching||B.pl.atkCd>0)return;B.pl.atkCd=ATK_CD;fireShot(B.pl,'atk');updateCdUi();}
function tryPlayerSkl(){
  const B=S.battle;if(!B||B.over||B.switching||B.pl.sklCd>0)return;B.pl.sklCd=SKL_CD;fireShot(B.pl,'skl');
  if(B.buff===B.pl.c.t){toast('地形加持！');B.buff=null;S.zoneBuff=null;document.getElementById('hudBuff').style.display='none';}
  updateCdUi();
}
function syncPartyHpFromBattle(){
  const B=S.battle;if(!B)return;
  B.plTeam.forEach(f=>{
    const mem=S.party.find(p=>p.id===f.id);if(mem)mem.hp=Math.max(0,f.hp);
  });
  updateHudParty();
}
function applyHit(proj,target){
  if(proj.hit)return;proj.hit=true;proj.life=0;
  const useBuff=proj.owner.isPlayer&&S.battle.buff===proj.owner.c.t;
  const r=calcDmg(proj.owner.c,target.c,proj.power,useBuff);
  target.hp-=r.dmg;target.hitFlash=0.25;
  S.battle.floats.push({x:target.x,y:target.y-30,text:'-'+r.dmg+(r.mul>1?'!':r.mul<1?'…':''),life:0.8,color:r.mul>1?'#fbbf24':r.mul<1?'#94a3b8':'#fff'});
  updateBattleHud();
  if(target.hp<=0){target.hp=0;onFaint(target);}
}
function onFaint(target){
  const B=S.battle;if(!B||B.over)return;
  syncPartyHpFromBattle();
  if(target.isPlayer){
    toast(target.c.n+' 倒下了！');
    const next=B.plTeam.findIndex((f,i)=>i!==B.plIdx&&f.hp>0);
    if(next<0){endBattle(false);return;}
    B.mustSwitch=true;B.switching=true;
    openSwitchPanel(true);
  }else{
    toast(target.c.n+' 倒下了！');
    const next=B.enTeam.findIndex((f,i)=>i!==B.enIdx&&f.hp>0);
    if(next<0){endBattle(true);return;}
    setTimeout(()=>switchEnemy(next),400);
  }
}
function switchEnemy(idx){
  const B=S.battle;if(!B||B.over)return;
  B.enIdx=idx;B.en=B.enTeam[idx];
  B.en.x=bW*0.72;B.en.y=bH*0.45;B.en.atkCd=0.5;B.en.sklCd=1;
  refreshActiveSprites();updateBattleHud();toast('對手派出 '+B.en.c.n+'！');
}
function openSwitchPanel(forced){
  const B=S.battle;if(!B)return;
  B.switching=true;B.mustSwitch=!!forced;
  const root=document.getElementById('switchList');root.innerHTML='';
  B.plTeam.forEach((f,i)=>{
    if(i===B.plIdx&&!forced)return;
    if(f.hp<=0)return;
    if(i===B.plIdx)return;
    const row=document.createElement('div');row.className='deploy-row';
    const cv=document.createElement('canvas');cv.width=48;cv.height=48;
    drawCreature(cv.getContext('2d'),f.c,48,48,{scale:0.5});
    const info=document.createElement('div');info.className='info';
    info.innerHTML='<div class="dn">'+f.c.n+'</div><div class="dmeta">HP '+Math.max(0,Math.round(f.hp))+'/'+f.max+' · '+f.c.t+'</div>';
    row.append(cv,info);
    row.onclick=()=>doSwitch(i);
    root.appendChild(row);
  });
  document.getElementById('btnSwitchCancel').style.display=forced?'none':'inline-block';
  document.getElementById('switchPanel').classList.add('show');
}
function doSwitch(idx){
  const B=S.battle;if(!B)return;
  const f=B.plTeam[idx];if(!f||f.hp<=0)return;
  B.plIdx=idx;B.pl=f;
  B.pl.x=bW*0.28;B.pl.y=bH*0.55;B.pl.atkCd=Math.max(B.pl.atkCd,0.3);B.pl.sklCd=Math.max(B.pl.sklCd,0.3);
  B.switching=false;B.mustSwitch=false;
  document.getElementById('switchPanel').classList.remove('show');
  refreshActiveSprites();updateBattleHud();updateCdUi();
  toast('換上 '+f.c.n+'！');
}
function tryOpenSwitch(){
  const B=S.battle;if(!B||B.over||B.switching)return;
  const alive=B.plTeam.filter((f,i)=>i!==B.plIdx&&f.hp>0);
  if(alive.length<1){toast('沒有可換的夥伴');return;}
  openSwitchPanel(false);
}
function endBattle(won){
  const B=S.battle;if(!B||B.over)return;B.over=true;B.won=won;B.switching=false;
  document.getElementById('switchPanel').classList.remove('show');
  syncPartyHpFromBattle();
  const res=document.getElementById('bResult');res.classList.add('show',won?'win':'lose');
  document.getElementById('bResTitle').textContent=won?'勝利！':'落敗…';
  document.getElementById('bResMsg').textContent=won?'隊伍表現出色！可到休息亭恢復後再挑戰。':'全員倒下了。回休息亭恢復後再試一次吧。';
}
function clampArena(f){f.x=Math.max(40,Math.min(bW-40,f.x));f.y=Math.max(80,Math.min(bH-100,f.y));}
function updateAI(dt){
  const B=S.battle;if(!B||B.over||B.switching)return;
  const en=B.en,pl=B.pl,dx=pl.x-en.x,dy=pl.y-en.y,dist=Math.hypot(dx,dy)||1;
  let mx=dx/dist,my=dy/dist;
  if(dist<95){mx=-mx;my=-my;}else if(dist<170){const sx=-dy/dist,sy=dx/dist;mx=sx*0.7+mx*0.3;my=sy*0.7+my*0.3;}
  en.x+=mx*en.speed*0.85*dt;en.y+=my*en.speed*0.85*dt;en.facing=pl.x>=en.x?1:-1;clampArena(en);
  if(dist<210&&en.sklCd<=0&&Math.random()<dt*1.2){en.sklCd=SKL_CD;fireShot(en,'skl');}
  else if(dist<180&&en.atkCd<=0){en.atkCd=ATK_CD;fireShot(en,'atk');}
}
function updateBattle(dt){
  const B=S.battle;if(!B||S.screen!=='battle')return;
  B.t+=dt;if(B.over||B.switching){drawBattle();return;}
  B.pl.atkCd=Math.max(0,B.pl.atkCd-dt);B.pl.sklCd=Math.max(0,B.pl.sklCd-dt);
  B.en.atkCd=Math.max(0,B.en.atkCd-dt);B.en.sklCd=Math.max(0,B.en.sklCd-dt);
  B.pl.hitFlash=Math.max(0,B.pl.hitFlash-dt);B.en.hitFlash=Math.max(0,B.en.hitFlash-dt);
  let dx=0,dy=0;
  if(S.keys['w']||S.keys['arrowup'])dy-=1;if(S.keys['s']||S.keys['arrowdown'])dy+=1;
  if(S.keys['a']||S.keys['arrowleft'])dx-=1;if(S.keys['d']||S.keys['arrowright'])dx+=1;
  dx+=bStick.dx;dy+=bStick.dy;const len=Math.hypot(dx,dy);
  if(len>0.15){dx/=len;dy/=len;B.pl.x+=dx*B.pl.speed*dt;B.pl.y+=dy*B.pl.speed*dt;B.pl.facing=dx>=0?1:-1;}
  clampArena(B.pl);
  if(S.keys['j']||S.keys[' ']){if(!updateBattle._j)tryPlayerAtk();updateBattle._j=true;}else updateBattle._j=false;
  if(S.keys['k']||S.keys['enter']){if(!updateBattle._k)tryPlayerSkl();updateBattle._k=true;}else updateBattle._k=false;
  if(S.keys['u']||S.keys['l']){if(!updateBattle._u)tryOpenSwitch();updateBattle._u=true;}else updateBattle._u=false;
  updateAI(dt);
  for(let i=B.projectiles.length-1;i>=0;i--){
    const p=B.projectiles[i];p.life-=dt;if(!p.melee){p.x+=p.vx*dt;p.y+=p.vy*dt;}
    const target=p.owner.isPlayer?B.en:B.pl;
    if(!p.hit&&Math.hypot(p.x-target.x,p.y-target.y)<p.rad+target.radius)applyHit(p,target);
    if(p.life<=0||p.x<-50||p.x>bW+50||p.y<-50||p.y>bH+50)B.projectiles.splice(i,1);
  }
  for(let i=B.floats.length-1;i>=0;i--){const f=B.floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)B.floats.splice(i,1);}
  updateCdUi();drawBattle();
}
function drawBattle(){
  const B=S.battle;if(!B)return;const ctx=bCtx;
  const g=ctx.createLinearGradient(0,0,0,bH);g.addColorStop(0,'#3d5a46');g.addColorStop(.55,'#2f4a38');g.addColorStop(1,'#1a2e24');
  ctx.fillStyle=g;ctx.fillRect(0,0,bW,bH);
  ctx.strokeStyle='rgba(251,191,36,.45)';ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(bW/2,bH*.52,Math.min(bW,bH)*.38,Math.min(bW,bH)*.22,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.04)';ctx.beginPath();ctx.ellipse(bW/2,bH*.52,Math.min(bW,bH)*.38,Math.min(bW,bH)*.22,0,0,Math.PI*2);ctx.fill();
  const drawF=(f,key)=>{
    if(f.hp<=0&&(key==='pl'?B.pl:B.en)!==f)return;
    const bob=Math.sin(B.t*6+(key==='pl'?0:1))*3;
    ctx.save();if(f.hitFlash>0)ctx.globalAlpha=.5+.5*Math.sin(B.t*40);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(f.x,f.y+34,26,9,0,0,Math.PI*2);ctx.fill();
    ctx.translate(f.x,f.y+bob);
    const face=f.facing;const baseFlip=key==='pl'?-1:1;
    ctx.scale(face*baseFlip*0.95,0.95);
    ctx.drawImage(B.sprites[key],-48,-52);
    ctx.restore();
  };
  if(B.en.y<B.pl.y){drawF(B.en,'en');drawF(B.pl,'pl');}else{drawF(B.pl,'pl');drawF(B.en,'en');}
  B.projectiles.forEach(p=>{
    const a=Math.max(0,p.life/p.maxLife);ctx.globalAlpha=.5+.5*a;ctx.fillStyle=p.color;
    if(p.melee){ctx.beginPath();ctx.arc(p.x,p.y,p.rad*(.6+.4*(1-a)),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.rad,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(p.x-2,p.y-2,p.rad*.4,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=1;
  });
  ctx.font='bold 18px "Noto Sans TC",sans-serif';ctx.textAlign='center';
  B.floats.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life/.8);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);ctx.globalAlpha=1;});
}

(function setupBPad(){
  const wrap=document.getElementById('bPad'),knob=document.getElementById('bPadKnob');
  let active=false,ox=0,oy=0;const R=42;
  const setKnob=(dx,dy)=>{const len=Math.hypot(dx,dy)||1,c=Math.min(len,R);knob.style.transform='translate(calc(-50% + '+dx/len*c+'px), calc(-50% + '+dy/len*c+'px))';};
  wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);const r=wrap.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;active=true;let dx=e.clientX-ox,dy=e.clientY-oy;const len=Math.hypot(dx,dy);if(len>R){dx=dx/len*R;dy=dy/len*R;}setKnob(dx,dy);bStick.dx=dx/R;bStick.dy=dy/R;e.preventDefault();});
  wrap.addEventListener('pointermove',e=>{if(!active)return;let dx=e.clientX-ox,dy=e.clientY-oy;const len=Math.hypot(dx,dy);if(len>R){dx=dx/len*R;dy=dy/len*R;}setKnob(dx,dy);bStick.dx=dx/R;bStick.dy=dy/R;});
  const up=()=>{active=false;bStick.dx=0;bStick.dy=0;setKnob(0,0);};
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
})();
document.getElementById('btnAtk').onclick=tryPlayerAtk;
document.getElementById('btnSkl').onclick=tryPlayerSkl;
document.getElementById('btnSwitch').onclick=tryOpenSwitch;
document.getElementById('btnSwitchCancel').onclick=()=>{
  const B=S.battle;if(B&&B.mustSwitch)return;
  if(B)B.switching=false;
  document.getElementById('switchPanel').classList.remove('show');
};

(function setupStick(){
  const wrap=document.getElementById('stickWrap'),knob=document.getElementById('stickKnob');
  let active=false,ox=0,oy=0;const R=36;
  const setKnob=(dx,dy)=>{const len=Math.hypot(dx,dy)||1,c=Math.min(len,R);knob.style.transform='translate(calc(-50% + '+dx/len*c+'px), calc(-50% + '+dy/len*c+'px))';};
  wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);const r=wrap.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;active=true;});
  wrap.addEventListener('pointermove',e=>{if(!active)return;let dx=e.clientX-ox,dy=e.clientY-oy;const len=Math.hypot(dx,dy);if(len>R){dx=dx/len*R;dy=dy/len*R;}setKnob(dx,dy);S.stick.dx=dx/R;S.stick.dy=dy/R;});
  const up=()=>{active=false;S.stick.dx=0;S.stick.dy=0;setKnob(0,0);};
  wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
})();

window.addEventListener('keydown',e=>{
  S.keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if((e.key===' '||e.key==='Enter')&&S.screen==='map'&&!S.dialogOpen&&!document.getElementById('deploy').classList.contains('show'))interact();
  if(e.key==='Escape'&&S.dialogOpen)closeDialog();
});
window.addEventListener('keyup',e=>{S.keys[e.key.toLowerCase()]=false;});

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;animT++;
  if(S.screen==='map'&&!S.dialogOpen&&!document.getElementById('deploy').classList.contains('show')){
    let dx=0,dy=0;
    if(S.keys['w']||S.keys['arrowup'])dy-=1;if(S.keys['s']||S.keys['arrowdown'])dy+=1;
    if(S.keys['a']||S.keys['arrowleft'])dx-=1;if(S.keys['d']||S.keys['arrowright'])dx+=1;
    dx+=S.stick.dx;dy+=S.stick.dy;const len=Math.hypot(dx,dy);
    if(len>0.15){const n=Math.max(len,1);tryMove(dx/n,dy/n,dt);}
    drawMap();
  }
  if(S.screen==='battle')updateBattle(dt);
  requestAnimationFrame(loop);
}

document.getElementById('btnStart').onclick=()=>{buildRoster();show('pick');};
document.getElementById('btnConfirmPick').onclick=confirmPick;
document.getElementById('btnPickClear').onclick=()=>{S.pickSel=[];syncPickCards();renderPartySlots();};
document.getElementById('btnInteract').onclick=interact;
document.getElementById('btnDexTitle').onclick=openDex;
document.getElementById('btnDexMap').onclick=openDex;
document.getElementById('btnDexBack').onclick=()=>show(S.party.length?'map':'title');
document.querySelectorAll('.dtab').forEach(t=>t.onclick=()=>{S.dexTab=t.dataset.tab;renderDex();});
document.getElementById('btnDeployCancel').onclick=closeDeploy;
document.getElementById('btnDeployGo').onclick=()=>{
  if(!S.deploySel.length||!S.pendingFoes)return;
  const foes=S.pendingFoes,npc=S.pendingNpc,dep=S.deploySel.slice();
  closeDeploy();startBattle(foes,npc,dep);
};
document.getElementById('btnMenu').onclick=()=>{
  const names=S.party.map(p=>byId(p.id).n).join('、')||'—';
  openDialog('選單','隊伍：'+names,[
    {l:'夥伴中心',fn:()=>{closeDialog();S.fromCenter=true;buildRoster();show('pick');}},
    {l:'波克萌圖鑑',fn:()=>{closeDialog();openDex();}},
    {l:'回標題',sec:true,fn:()=>{closeDialog();show('title');}},
    {l:'關閉',sec:true,fn:closeDialog}
  ]);
};
document.getElementById('btnRematch').onclick=()=>{
  const B=S.battle;if(!B)return;
  const foes=B.foeIds,npc=B.npc;
  S.party.forEach(p=>{if(p.hp<=0)p.hp=byId(p.id).hp;});
  updateHudParty();show('map');openDeploy(foes,npc);
};
document.getElementById('btnBackMap').onclick=()=>{
  S.party.forEach(p=>{if(p.hp<=0)p.hp=Math.max(1,Math.floor(byId(p.id).hp*0.3));});
  updateHudParty();show('map');
};
window.addEventListener('resize',()=>{if(S.screen==='map'){resizeMap();drawMap();}if(S.screen==='battle'){resizeBattle();if(S.battle){S.battle.pl.x=Math.min(S.battle.pl.x,bW-40);S.battle.en.x=Math.min(S.battle.en.x,bW-40);}}});

drawTitleArt();
requestAnimationFrame(loop);
window.__GAME__={S,CREATURES,MOVES,TYPES,EFF,show,confirmPick,startBattle,openDeploy,openDex,byId,bases,lineageLabel,tryPlayerAtk,tryPlayerSkl,walkable,zoneAt};
})();
</script>
