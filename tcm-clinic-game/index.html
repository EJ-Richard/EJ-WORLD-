<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

/* ================= 基本設定 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('game').appendChild(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6ff);
scene.fog = new THREE.Fog(0xbfe6ff, 45, 95);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8a8, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(12, 30, 18); scene.add(sun);

/* ================= 小工具 ================= */
let seed = 20261023;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const shade = (h, f) => { const [r, g, b] = hexRgb(h); const c = v => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${c(r)},${c(g)},${c(b)})`; };
function canvasTex(w, h, draw, pixel = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (pixel) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }
  else { t.anisotropy = 4; }
  t.userData = { canvas: c }; return t;
}
function noiseTex(base, amt = 0.08, extra) {
  return canvasTex(16, 16, (g, s) => { for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) { g.fillStyle = shade(base, 1 + (rnd() - .5) * 2 * amt); g.fillRect(x, y, 1, 1); } extra && extra(g, s); });
}
const matCache = new Map();
function lam(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshLambertMaterial({ color, ...opts }));
  return matCache.get(key);
}

/* ================= 方塊材質 ================= */
const TEX = {
  granite: noiseTex('#b4b8bd', .05, (g) => { for (let i = 0; i < 26; i++) { g.fillStyle = rnd() < .5 ? '#8d9196' : '#e3e5e8'; g.fillRect(rnd() * 16 | 0, rnd() * 16 | 0, 1, 1); } g.fillStyle = '#a2a6ab'; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16); }),
  wood: canvasTex(16, 16, (g) => { for (let b = 0; b < 4; b++) { const t = 1 + (rnd() - .5) * .18; for (let y = 0; y < 4; y++) for (let x = 0; x < 16; x++) { g.fillStyle = shade('#d6a46a', t * (1 + (rnd() - .5) * .08) * (x % 7 == 0 ? .96 : 1)); g.fillRect(x, b * 4 + y, 1, 1); } g.fillStyle = shade('#d6a46a', .78); g.fillRect(0, b * 4 + 3, 16, 1); const s = rnd() * 16 | 0; g.fillRect(s, b * 4, 1, 3); } }),
  carpet: noiseTex('#4a4643', .12),
  panel: canvasTex(16, 16, (g) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = shade('#dcb48a', 1 + (rnd() - .5) * .06 + (x % 5 == 0 ? -.03 : 0)); g.fillRect(x, y, 1, 1); } g.fillStyle = shade('#dcb48a', .8); g.fillRect(0, 0, 1, 16); }),
  white: noiseTex('#f3f0e8', .015),
  grey: noiseTex('#d9dadb', .02),
};
const BUILD_TYPES = [
  { id: 'grass', name: '草地', tex: noiseTex('#5dbb4a', .12, g => { g.fillStyle = '#4a9a3a'; for (let i = 0; i < 12; i++) g.fillRect(rnd() * 16 | 0, rnd() * 16 | 0, 1, 2); }) },
  { id: 'stone', name: '石頭', tex: noiseTex('#8f9396', .14) },
  { id: 'brick', name: '磚塊', tex: canvasTex(16, 16, g => { g.fillStyle = '#ccc'; g.fillRect(0, 0, 16, 16); for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { g.fillStyle = shade('#b4483a', 1 + (rnd() - .5) * .2); g.fillRect(((c * 6 + (r % 2) * 3) % 18) - 1, r * 4, 5, 3); } }) },
  { id: 'plank', name: '木板', tex: noiseTex('#b8864b', .1, g => { g.fillStyle = '#8a6030'; g.fillRect(0, 7, 16, 1); g.fillRect(0, 15, 16, 1); }) },
  { id: 'gold', name: '金塊', tex: noiseTex('#f2c94c', .08, g => { g.fillStyle = '#fff6c0'; g.fillRect(2, 2, 3, 1); g.fillRect(2, 3, 1, 2); }) },
  { id: 'glass', name: '玻璃', tex: canvasTex(16, 16, g => { g.fillStyle = '#bfe9ff'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#ffffff'; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16); g.fillRect(15, 0, 1, 16); g.fillRect(0, 15, 16, 1); g.fillRect(4, 4, 2, 1); g.fillRect(4, 5, 1, 2); }), opacity: .55 },
  { id: 'leaf', name: '樹葉', tex: noiseTex('#2e8b3a', .2) },
  { id: 'snow', name: '白雪', tex: noiseTex('#f7f9fb', .03) },
];

/* ================= 體素世界 ================= */
const W = { x0: -2, y0: -1, z0: -9, sx: 40, sy: 10, sz: 40 };
const grid = new Uint8Array(W.sx * W.sy * W.sz); // 0 空 1 牆/地板 2 建造方塊 3 家具
function cidx(x, y, z) { x -= W.x0; y -= W.y0; z -= W.z0; if (x < 0 || y < 0 || z < 0 || x >= W.sx || y >= W.sy || z >= W.sz) return -1; return x + W.sx * (y + W.sy * z); }
const getCell = (x, y, z) => { const i = cidx(x, y, z); return i < 0 ? 0 : grid[i]; };
const setCell = (x, y, z, v) => { const i = cidx(x, y, z); if (i >= 0) grid[i] = v; };
const staticMap = new Map();
function putStatic(x, y, z, type) { staticMap.set(`${x},${y},${z}`, type); setCell(x, y, z, 1); }
function delStatic(x, y, z) { staticMap.delete(`${x},${y},${z}`); setCell(x, y, z, 0); }

const ROOMS = [
  { id: 'hallway', name: '走廊（163 門口）', short: '走廊', x0: 1, x1: 34, z0: 21, z1: 27, floor: 'granite', wains: false, color: '#2f80ed', spawn: [5.6, 24.4, 0.2], label: [6, 22.5],

    const bk = new THREE.Vector3(-dx, -dy + .25 + lift, -dz).normalize(); const d = freeDist(bk);
    if (d > want + .3 || !back) { want = d; back = bk; }
    if (d >= 3.6) break;
  }
  if (!camBack) camBack = back.clone(); else camBack.lerp(back, Math.min(1, dt * 6)).normalize();
  want = Math.min(want, freeDist(camBack));
  back = camBack;
  camDist += (want - camDist) * Math.min(1, dt * (want < camDist ? 30 : 4));
  camera.position.set(camTarget.x + back.x * camDist, camTarget.y + back.y * camDist, camTarget.z + back.z * camDist);
  const lift = Math.max(0, back.y - .3); camera.lookAt(camTarget.x + dx * (2 + lift * 4), camTarget.y + dy * 2 - .2, camTarget.z + dz * (2 + lift * 4));
  player.visible = camDist > .8;
}

/* ================= 小地圖 ================= */
const mm = $('minimap'), mg = mm.getContext('2d');
const MAP = { x0: -1, z0: -8, size: 37 };
function mapXY(x, z) { const s = mm.width / MAP.size; return [(x - MAP.x0) * s, (z - MAP.z0) * s]; }
function drawMinimap(t) {
  const s = mm.width / MAP.size; mg.fillStyle = '#e8eef5'; mg.fillRect(0, 0, mm.width, mm.height);
  for (const r of ROOMS) {
    const [x, y] = mapXY(r.x0, r.z0); const w = (r.x1 - r.x0 + 1) * s, h = (r.z1 - r.z0 + 1) * s;
    mg.fillStyle = r.color + (curRoom === r ? 'ff' : 'b0'); mg.fillRect(x, y, w, h);
    mg.strokeStyle = '#2b3a55'; mg.lineWidth = 3; mg.strokeRect(x, y, w, h);
    mg.font = '900 26px "Noto Sans CJK TC","PingFang TC",sans-serif'; mg.textAlign = 'center'; mg.textBaseline = 'middle';
    mg.lineWidth = 5; mg.strokeStyle = '#0008'; mg.strokeText(r.short, x + w / 2, y + h / 2); mg.fillStyle = '#fff'; mg.fillText(r.short, x + w / 2, y + h / 2);
  }
  const tg = questTarget();
  if (tg) { const [x, y] = mapXY(tg.p.x, tg.p.z); mg.font = `${22 + Math.sin(t * 6) * 5}px sans-serif`; mg.fillText('⭐', x, y); }
  const [px, py] = mapXY(pos.x, pos.z); const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
  mg.save(); mg.translate(px, py); mg.rotate(Math.atan2(fx, -fz));
  mg.fillStyle = '#fff'; mg.strokeStyle = '#d0312d'; mg.lineWidth = 4; mg.beginPath(); mg.moveTo(0, -14); mg.lineTo(10, 10); mg.lineTo(0, 5); mg.lineTo(-10, 10); mg.closePath(); mg.fill(); mg.stroke(); mg.restore();
}
mm.addEventListener('click', e => {
  if (uiOpen || acuMode) return;
  const rc = mm.getBoundingClientRect(); const x = (e.clientX - rc.left) / rc.width * MAP.size + MAP.x0, z = (e.clientY - rc.top) / rc.height * MAP.size + MAP.z0;
  const r = roomAt(x, z); if (!r) { toast('點彩色的房間才能傳送喔！'); return; }
  const fx = Math.floor(x), fz = Math.floor(z);
  if (!getCell(fx, 0, fz) && !getCell(fx, 1, fz)) { teleport(fx + .5, fz + .5); toast(`📍 傳送到「${r.name}」`); sfx('pop'); } else teleportRoom(r);
});

/* ================= 主迴圈 ================= */
let nearest = null, nearT = 0, last = performance.now(), frame = 0;
function updateNearest() {
  updateDynHits(); nearest = null; let bd = 1.6; const c = new THREE.Vector3(pos.x, pos.y + .9, pos.z);
  if (!acuMode && mode !== 'build') for (const h of hits) if (h.near) { const d = h.box.distanceToPoint(c); if (d < bd) { bd = d; nearest = h; } }
  const b = $('actBtn');
  if (nearest && !uiOpen) { const icon = animals[nearest.key] || nearest.key === 'statue' ? '💬' : '👆'; b.textContent = `${icon} ${nearest.name}${isTouch ? '' : '（E）'}`; b.style.display = 'block'; }
  else b.style.display = 'none';
}
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000; frame++;
  updatePlayer(dt); updateCamera(dt);
  for (const k in animals) {
    const a = animals[k];
    a.g.position.y = (a.baseY || 0) + (a.happy ? Math.abs(Math.sin(t * 4 + k.length)) * .06 : 0);
    if (k === 'owl') a.head.rotation.z = a.happy ? Math.sin(t * 2) * .15 : .45;
    if (k === 'bear') a.body.rotation.x = a.happy ? 0 : .22;
    if (k === 'dog') a.body.rotation.z = a.happy ? Math.sin(t * 8) * .04 : 0;
    if (a.wiggle > 0) { a.wiggle -= dt; a.body.rotation.z = Math.sin(t * 40) * .08; } else if (k !== 'dog') a.body.rotation.z = 0;
  }
  if (acuMode) { const sc = 1 + Math.sin(t * 6) * .35; acuMarkers.forEach(m => m.scale.setScalar(sc)); }
  lamps.forEach(L => { if (L.on) L.cone.material.opacity = .18 + Math.sin(t * 5 + L.idx) * .05; });
  updateSteam(dt, t);
  nearT -= dt; if (nearT <= 0) { nearT = .15; updateNearest(); }
  renderer.render(scene, camera);
  updateLabels();
  if (frame % 3 === 0) drawMinimap(t);
}
function layoutUI() { document.documentElement.style.setProperty('--tbh', $('toolbar').offsetHeight + 'px'); }
function onResize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 82 : 70; camera.updateProjectionMatrix(); layoutUI(); }
addEventListener('resize', onResize); onResize();
layoutUI(); updateQuestUI();
teleport(5.6, 24.4, .2);
requestAnimationFrame(tick);
$('startBtn').disabled = false; $('startBtn').textContent = '▶ 開始遊戲';
$('startBtn').onclick = () => { sfx('click'); $('start').style.display = 'none'; layoutUI(); toast('👴 先去找<b>銅人爺爺</b>！點他或走近按「互動」。', 4000); };

/* 測試用介面 */
window.__game = { Q, teleport, teleportRoom, ROOMS, animals, lamps, onInteract, hits, setView, setMode, setFly, steamSources,
  setLook: (y, p) => { yaw = y; pitch = p; }, get pos() { return pos; }, interactKey: (key, idx) => { const h = hits.find(h => h.key === key && (idx === undefined || h.idx === idx)); if (h) onInteract(h, true); },
  enterAcu, exitAcu, built, showAcu, buildAt, raycaster, camera, handleTap };
</script>
